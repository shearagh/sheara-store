services:
  - type: web
    name: sheara-store-staging
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sheara-postgres-staging
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: DB_POOL_MAX
        value: "5"
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: SITE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true

databases:
  - name: sheara-postgres-staging
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
