<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order confirmed | Sheara</title>
  <link rel="icon" href="assets/sheara-logo.png"><link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="payment-result">
    <div class="result-card">
      <p class="eyebrow">SHEARA</p>
      <div class="result-mark">✓</div>
      <h1>Your order is confirmed.</h1>
      <p>Thank you for shopping with Sheara. Your payment has been verified successfully.</p>
      <div class="result-reference"><span>Order reference</span><strong id="reference">—</strong></div>
      <p class="result-note" id="resultNote">We'll contact you using the details you provided to arrange delivery.</p>
      <a class="button button-dark" href="index.html#shop">Continue shopping</a>
    </div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const reference = params.get('reference');
    document.getElementById('reference').textContent = reference || '—';
    if(params.get('stockIssue')==='1') document.getElementById('resultNote').textContent='Your payment was verified, but stock changed before final fulfilment. Sheara will contact you promptly to arrange a refund or an alternative product.';
    localStorage.removeItem('shearaCart');
    localStorage.removeItem('shearaPendingOrder');
  </script>
</body>
</html>
