services:
  - type: web
    name: sheara-store
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install
    preDeployCommand: npm run migrate
    initialDeployHook: npm run seed
    startCommand: npm start
    healthCheckPath: /api/health
    numInstances: 2
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sheara-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: DB_POOL_MAX
        value: "15"
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: SITE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true


databases:
  - name: sheara-postgres
    plan: 0.5c-1g
    region: frankfurt
    postgresMajorVersion: "17"
    diskSizeGB: 15
    connectionPool: pgbouncer
    highAvailability: false
