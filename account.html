<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Sheara Account</title><link rel="icon" href="assets/sheara-logo.png"><link rel="stylesheet" href="styles.css"><style>.account-wrap{max-width:760px;margin:70px auto;padding:0 24px}.account-card{background:#fff;border:1px solid #e6e0d8;padding:30px;margin-top:20px}.account-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.account-card label{display:flex;flex-direction:column;gap:7px;margin-bottom:14px}.account-card input,.account-card select{padding:13px;border:1px solid #ccc;border-radius:6px;font:inherit;width:100%;box-sizing:border-box}.span2{grid-column:1/-1}.account-actions{display:flex;gap:12px;align-items:center}.account-message{margin-top:12px}.error{color:#9b2c2c}.success{color:#286b45}@media(max-width:650px){.account-grid{grid-template-columns:1fr}.span2{grid-column:auto}}</style></head><body><div class="announcement">Powered by shea. Rooted in nature.</div><header class="site-header"><a class="brand" href="index.html#top"><img src="assets/sheara-logo.png" alt="Sheara"></a><nav class="desktop-nav"><a href="index.html#shop">Shop</a><a href="about.html">Our Story</a><a href="journal.html">Journal</a><a href="retailers.html">Partner With Us</a></nav><a class="cart-button" href="index.html#shop">Shop</a></header><main class="account-wrap"><p class="eyebrow">SHEARA ACCOUNT</p><h1>Your Sheara account</h1><p>Save your country and account details so your storefront experience uses the correct local or international pricing.</p><section id="auth" class="account-card"><div class="account-grid"><form id="loginForm" class="span2"><h2>Sign in</h2><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="password" type="password" minlength="10" required autocomplete="current-password"></label><button class="button button-dark">Sign in</button><p id="loginMsg" class="account-message error"></p></form><form id="registerForm" class="span2"><h2>Create an account</h2><div class="account-grid"><label>Name<input name="name" required autocomplete="name"></label><label>Email<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="password" type="password" minlength="10" required autocomplete="new-password"></label><label>Country<select name="country"><option value="GH">Ghana</option><option value="US">United States</option><option value="GB">United Kingdom</option><option value="CA">Canada</option><option value="NG">Nigeria</option><option value="AU">Australia</option><option value="DE">Germany</option><option value="AE">United Arab Emirates</option></select></label></div><button class="button button-outline">Create account</button><p id="registerMsg" class="account-message"></p></form></div></section><section id="account" class="account-card" hidden><h2>Welcome, <span id="accountName"></span>.</h2><p id="accountEmail"></p><label>Country<select id="accountCountry"><option value="GH">Ghana</option><option value="US">United States</option><option value="GB">United Kingdom</option><option value="CA">Canada</option><option value="NG">Nigeria</option><option value="AU">Australia</option><option value="DE">Germany</option><option value="AE">United Arab Emirates</option></select></label><div class="account-actions"><button id="saveCountry" class="button button-dark">Save country</button><button id="logout" class="button button-outline">Sign out</button></div><p id="accountMsg" class="account-message"></p><p style="margin-top:24px"><a class="button button-outline" href="index.html#shop">Continue shopping</a></p></section></main><script>
const key='shearaCustomerToken';let token=localStorage.getItem(key)||'';const $=s=>document.querySelector(s);async function api(path,opts={}){opts.headers={...(opts.headers||{}),'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})};const r=await fetch(path,opts);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}function showAccount(c){$('#auth').hidden=true;$('#account').hidden=false;$('#accountName').textContent=c.name;$('#accountEmail').textContent=c.email;$('#accountCountry').value=c.country;localStorage.setItem('shearaCountry',c.country)}async function me(){if(!token)return;try{const d=await api('/api/auth/me');showAccount(d.customer)}catch{token='';localStorage.removeItem(key)}}$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const p=Object.fromEntries(new FormData(e.target));try{const d=await api('/api/auth/login',{method:'POST',body:JSON.stringify(p)});token=d.token;localStorage.setItem(key,token);showAccount(d.customer)}catch(err){$('#loginMsg').textContent=err.message}});$('#registerForm').addEventListener('submit',async e=>{e.preventDefault();const p=Object.fromEntries(new FormData(e.target));try{const d=await api('/api/auth/register',{method:'POST',body:JSON.stringify(p)});$('#registerMsg').className='account-message success';$('#registerMsg').textContent='Account created. You can now sign in.'}catch(err){$('#registerMsg').className='account-message error';$('#registerMsg').textContent=err.message}});$('#saveCountry').onclick=async()=>{const c=$('#accountCountry').value;localStorage.setItem('shearaCountry',c);$('#accountMsg').className='account-message success';$('#accountMsg').textContent='Country saved. Prices will update when you shop.'};$('#logout').onclick=async()=>{try{await api('/api/auth/logout',{method:'POST'})}catch{}localStorage.removeItem(key);location.reload()};me();
</script></body></html>
